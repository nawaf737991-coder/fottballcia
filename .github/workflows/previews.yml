name: match-previews
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = تجربة بدون نشر"
        default: "0"
permissions:
  contents: write
concurrency:
  group: match-previews
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SEO_DRAFT: ${{ vars.SEO_DRAFT || '0' }}
      DRY_RUN: ${{ inputs.dry || '0' }}
      MAX_PREVIEWS: '3'
      DAILY_PREVIEWS: '15'
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_DAILY: ${{ vars.X_DAILY || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q pillow arabic-reshaper python-bidi hijridate imageio-ffmpeg
      - name: Previews
        run: python3 -u previews.py
      - name: Video self-test
        if: ${{ inputs.dry == '1' }}
        run: python3 tiktok.py && python3 tiktok_results.py && ls -la /tmp/tk.mp4 /tmp/rs.mp4
      - name: Show dry output
        if: ${{ inputs.dry == '1' }}
        run: cat /tmp/preview_dry.html || true
      - name: Daily index links
        if: always() && inputs.dry != '1'
        continue-on-error: true
        run: python3 -u index_links.py
      - name: Commit data
        if: always() && inputs.dry != '1'
        run: |
          git config user.name "fottballcia-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/new
          for f in $(git status --porcelain -uall data/previews_state.json tweets.html img index-links.html data/index_links.json | awk '{print $2}'); do
            mkdir -p "/tmp/new/$(dirname "$f")"
            cp "$f" "/tmp/new/$f"
          done
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/new/. .
            git add data/previews_state.json tweets.html img index-links.html data/index_links.json 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "previews state + images"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
