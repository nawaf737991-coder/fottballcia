name: yt-videos
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: yt-videos, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 yt_videos.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data; git commit -m "yt videos" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 3; done
