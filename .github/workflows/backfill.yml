name: backfill-images
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = تجربة بدون تعديل"
        default: "1"
      limit:
        description: "أقصى عدد مقالات (0 = الكل)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: seo-posts
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRY_RUN: ${{ inputs.dry }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow arabic-reshaper python-bidi
      - name: Backfill
        run: python3 -u backfill_images.py
      - name: Commit images
        if: always()
        run: |
          git config user.name "fottballcia-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -d img ] || exit 0
          mkdir -p /tmp/new && cp -r img /tmp/new/
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/new/. .
            git add img
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "cover images for old posts"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
