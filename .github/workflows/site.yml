name: site-data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live | matches | news | auto"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REVIEW_NEWS: ${{ vars.REVIEW_NEWS || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Update data
        run: python3 site_bot.py ${{ inputs.mode || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "fottballcia-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/new
          for f in $(git status --porcelain data | awk '{print $2}'); do
            mkdir -p "/tmp/new/$(dirname "$f")"
            cp "$f" "/tmp/new/$f"
          done
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/new/. .
            git add data
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "update data"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
