name: site-data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live | matches | news | tables | days | auto"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REVIEW_NEWS: ${{ vars.REVIEW_NEWS || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Update data
        run: python3 site_bot.py ${{ inputs.mode || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "fottballcia-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/new
          : > /tmp/deleted.txt
          git status --porcelain -uall data | while read -r st f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/new/$(dirname "$f")"
              cp "$f" "/tmp/new/$f"
            else
              echo "$f" >> /tmp/deleted.txt
            fi
          done
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p /tmp/new
            cp -r /tmp/new/. .
            while read -r f; do [ -n "$f" ] && rm -f "$f"; done < /tmp/deleted.txt
            git add -A data
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "update data"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
