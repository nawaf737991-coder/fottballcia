name: mc-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 mc_test.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/match_sample; git commit -qm "match samples" || true
          git pull -q --rebase origin main; git push -q origin HEAD:main
